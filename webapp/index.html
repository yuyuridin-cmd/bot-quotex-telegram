<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bot Yuyu</title>
<style>
*{box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:0}
.view{display:none;padding:12px;min-height:100vh}.view.active{display:block}
.card{background:#1e1e1e;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #2a2a2a}
.logo{font-size:48px;text-align:center;margin:16px 0}
input,select{width:100%;background:#2a2a2a;border:1px solid #333;color:#fff;padding:14px;border-radius:12px;margin-top:8px}
.btn{width:100%;background:#00ff88;border:none;padding:16px;border-radius:14px;font-weight:bold;margin-top:12px;color:#000;font-size:15px}
.btn-dark{background:#2a2a2a;color:#fff}
.btn-outline{background:transparent;border:1px solid #444;color:#aaa}
.saldo{font-size:34px;font-weight:bold;margin-top:6px}
.badge{padding:6px 12px;border-radius:20px;font-size:12px;display:inline-block}
.badge-demo{background:#00ff88;color:#000}.badge-real{background:#ffaa00;color:#000}
.switch{display:flex;background:#2a2a2a;border-radius:12px;padding:4px;margin-top:8px}
.switch button{flex:1;padding:10px;border:none;border-radius:8px;background:transparent;color:#aaa}
.switch button.active{background:#00ff88;color:#000;font-weight:bold}
</style></head><body>

<div id="loginView" class="view active">
<div class="logo">🤖</div>
<div class="card" style="text-align:center"><h2 style="margin:0">Bot Yuyu</h2><div style="color:#666;font-size:13px">Conectar Cuenta Quotex</div></div>
<div class="card">
<div style="font-size:12px;color:#aaa">TIPO DE CUENTA</div>
<div class="switch"><button id="btnDemoSel" class="active">DEMO</button><button id="btnRealSel">REAL</button></div>
<input id="email" type="email" placeholder="Tu correo de Quotex">
<input id="pass" type="password" placeholder="Tu contraseña">
<button class="btn" id="btnIniciar">▶ INICIAR</button>
<div id="msg" style="color:#ff4444;font-size:12px;text-align:center;margin-top:10px"></div>
</div>
</div>

<div id="dashView" class="view">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<button class="btn-outline" style="padding:8px 12px;border-radius:20px" id="btnAtras">← Atrás / Cambiar cuenta</button>
<div id="emailShow" style="font-size:11px;color:#666"></div>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="color:#aaa;font-size:13px">SALDO DISPONIBLE</span>
<span style="display:flex;gap:6px"><span class="badge" id="porcBadge" style="background:#0a3d28;color:#00ff88">+0%</span><span class="badge badge-demo" id="modoBadge">DEMO</span></span>
</div>
<div class="saldo" id="saldo">$0.00</div>
<div style="margin-top:10px;display:flex;gap:8px">
<button id="dashDemo" class="badge badge-demo" style="border:none">DEMO</button>
<button id="dashReal" class="badge" style="border:none;background:#2a2a2a;color:#aaa">REAL</button>
</div>
</div>
<div class="card">
<div style="color:#aaa;font-size:13px">ESTADISTICAS HOY</div>
<div style="display:flex;justify-content:space-between;margin-top:12px">
<div>Ganadas: <b id="ganadas" style="color:#00ff88">0</b></div>
<div>Perdidas: <b id="perdidas" style="color:#ff5555">0</b></div>
<div><span class="badge" style="background:#2a2a2a" id="efect">0%</span></div>
</div>
<div style="font-size:12px;color:#777;margin-top:8px">Base hoy: <span id="base">$0</span> | Ganancia hoy: <span id="ganancia">$0</span></div>
</div>
<div class="card">
<div style="display:flex;justify-content:space-between">Monto <span id="montoTxt" style="color:#00ff88;font-weight:bold">6%</span></div>
<input id="monto" type="range" min="1" max="20" value="6">
<div style="display:flex;gap:10px;margin-top:10px">
<div style="flex:1">Limite Ganancia $<input id="limG" value="10"></div>
<div style="flex:1">Limite Perdida $<input id="limP" value="10"></div>
</div>
<button class="btn" id="btnAuto">▶ INICIAR AUTOMATICO</button>
</div>
<div class="card"><div style="color:#aaa;font-size:13px">HISTORIAL HOY</div><div id="hist" style="font-size:12px;color:#555;margin-top:8px">Sin operaciones aún</div></div>
</div>

<script>
let modoSel="DEMO";
function setModo(m){modoSel=m;document.getElementById('btnDemoSel').classList.toggle('active',m=="DEMO");document.getElementById('btnRealSel').classList.toggle('active',m=="REAL");}
document.getElementById('btnDemoSel').onclick=()=>setModo("DEMO");
document.getElementById('btnRealSel').onclick=()=>setModo("REAL");
document.getElementById('dashDemo').onclick=()=>cambiarModo("DEMO");
document.getElementById('dashReal').onclick=()=>cambiarModo("REAL");
async function cambiarModo(nuevo){await fetch('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({modo:nuevo})});load();}
async function load(){
 try{
  let d=await (await fetch('/api/balance')).json();
  if(!d.conectado){document.getElementById('loginView').classList.add('active');document.getElementById('dashView').classList.remove('active');return}
  document.getElementById('loginView').classList.remove('active');document.getElementById('dashView').classList.add('active');
  document.getElementById('saldo').innerText='$'+Number(d.saldo||0).toLocaleString(undefined,{minimumFractionDigits:2});
  document.getElementById('base').innerText='$'+Number(d.base||0).toLocaleString();
  document.getElementById('ganancia').innerText='$'+Number(d.ganancia||0).toFixed(2);
  document.getElementById('ganadas').innerText=d.wins||0;
  document.getElementById('perdidas').innerText=d.loss||0;
  document.getElementById('efect').innerText=(d.efectividad||0)+'%';
  let porc=d.porcentaje_hoy||0;
  let pb=document.getElementById('porcBadge');pb.innerText=(porc>=0?'+':'')+porc+'%';pb.style.color=porc>=0?'#00ff88':'#ff5555';
  document.getElementById('modoBadge').innerText=d.modo;document.getElementById('modoBadge').className='badge '+(d.modo=='REAL'?'badge-real':'badge-demo');
  document.getElementById('emailShow').innerText=d.email||'';
 }catch(e){}
}
document.getElementById('btnIniciar').onclick=async()=>{
 let email=document.getElementById('email').value.trim();let password=document.getElementById('pass').value.trim();
 if(!email||!password){document.getElementById('msg').innerText='Pon correo y contraseña';return}
 document.getElementById('msg').innerText='Conectando...';
 let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,modo:modoSel})});
 let d=await r.json();
 if(d.ok){document.getElementById('msg').innerText='';load();}else{document.getElementById('msg').innerText=d.error||'No conecta';}
};
document.getElementById('btnAtras').onclick=async()=>{await fetch('/api/logout',{method:'POST'});document.getElementById('loginView').classList.add('active');document.getElementById('dashView').classList.remove('active');document.getElementById('msg').innerText='Sesión cerrada. Pon otra cuenta';};
document.getElementById('btnAuto').onclick=async()=>{let d=await (await fetch('/api/balance')).json();await fetch(d.activo?'/api/stop':'/api/start',{method:'POST'});load();};
document.getElementById('monto').oninput=function(){document.getElementById('montoTxt').innerText=this.value+'%';fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({monto_pct:this.value})})};
load();setInterval(load,3000);
</script>
</body>
</html>
