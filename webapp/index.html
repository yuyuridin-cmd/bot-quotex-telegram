<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{background:#0f1115;color:white;font-family:Arial;padding:12px;margin:0}
.card{background:#1c1f26;border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid #2a2e39}
.badge{background:#2a2e39;padding:4px 10px;border-radius:20px;font-size:12px}
.green{color:#00ff88} .red{color:#ff4d4d}
.btn{width:100%;padding:16px;border-radius:14px;font-weight:bold;border:0;font-size:16px}
.btn-green{background:#00ff88;color:#000}
.btn-red{background:#ff4d4d;color:#fff}
input{background:#0f1115;border:1px solid #333;color:#fff;padding:8px;border-radius:8px;width:70px;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="card">
<div class="row"><small>SALDO DISPONIBLE</small><span class="badge" id="mode">DEMO</span></div>
<h2 id="balance" style="margin:8px 0">$115,722.81</h2>
<div><button onclick="setMode('DEMO')" style="background:#00ff88;border:0;padding:6px 12px;border-radius:8px">DEMO</button> <button onclick="setMode('REAL')" style="background:#2a2e39;color:#fff;border:0;padding:6px 12px;border-radius:8px">REAL</button></div>
</div>
<div class="card">
<small>ESTADISTICAS HOY</small><br>
<div class="row" style="margin-top:8px"><span>Ganadas: <b id="wins" class="green">0</b></span><span>Perdidas: <b id="losses" class="red">0</b></span><span id="eff" style="background:#2a2e39;padding:4px 8px;border-radius:8px">0%</span></div>
<div style="margin-top:10px;font-size:13px;color:#aaa">Base hoy: $<span id="base">0</span> | Ganancia hoy: $<span id="profit">0</span></div>
</div>
<div class="card">
<div class="row">Monto <span><input type="range" id="perc" min="1" max="10" value="2" oninput="document.getElementById('percval').innerText=this.value+'%'"> <b id="percval">2%</b></span></div>
<div class="row" style="margin-top:12px">Limite Ganancia $ <input id="gain" type="number" value="10"> Limite Perdida $ <input id="loss" type="number" value="10"></div>
</div>
<button class="btn btn-green" id="btnStart" onclick="toggleBot()">▶ INICIAR AUTOMATICO</button>
<div class="card" style="margin-top:12px">
<small>HISTORIAL HOY</small>
<div id="list" style="margin-top:10px;font-size:13px"></div>
</div>
<script>
let running=false;
async function load(){
  let b=await (await fetch('/api/balance')).json();
  document.getElementById('balance').innerText='$'+(b.mode=='DEMO'?b.demo:b.real);
  document.getElementById('mode').innerText=b.mode;
  let s=await (await fetch('/api/stats')).json();
  document.getElementById('wins').innerText=s.wins;
  document.getElementById('losses').innerText=s.losses;
  document.getElementById('eff').innerText=s.eff+'%';
  document.getElementById('base').innerText=s.base;
  document.getElementById('profit').innerText=s.profit_today;
  document.getElementById('gain').value=s.limits.gain;
  document.getElementById('loss').value=s.limits.loss;
  document.getElementById('list').innerHTML=s.history.length==0?'<span style="color:#666">Sin operaciones aun</span>':s.history.map(h=>`<div style="padding:6px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>${h.result} ${h.par}</span><span style="color:${h.amount>0?'#00ff88':'#ff4d4d'}">${h.amount>0?'+':''}$${h.amount} -> $${h.balance}</span></div>`).join('');
  running=s.running;
  let btn=document.getElementById('btnStart');
  btn.innerText=running?'⏸ DETENER BOT':'▶ INICIAR AUTOMATICO';
  btn.className=running?'btn btn-red':'btn btn-green';
}
async function toggleBot(){
  if(!running){
    let gain=document.getElementById('gain').value, loss=document.getElementById('loss').value;
    await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gain,loss,mode:document.getElementById('mode').innerText})});
    await fetch('/api/start',{method:'POST'});
  }else{ await fetch('/api/stop',{method:'POST'}); }
  load();
}
function setMode(m){ document.getElementById('mode').innerText=m; fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({gain:document.getElementById('gain').value,loss:document.getElementById('loss').value,mode:m})}).then(()=>load()); }
setInterval(load,2000); load();
</script>
</body>
</html>
